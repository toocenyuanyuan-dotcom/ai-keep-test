<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接続テスト</title>
<style>
  :root { --ink: #242422; --paper: #faf8f3; --line: #d8d5cc; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; line-height: 21px; }
  main { max-width: 420px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 12px; font-weight: 400; margin: 0 0 24px; }
  label { display: block; margin: 24px 0 9px; }
  input[type=range] { width: 100%; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid button { font: inherit; font-size: 12px; text-align: left; padding: 9px; border: 1px solid var(--line); background: none; color: var(--ink); }
  .grid button[aria-pressed=true] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  #send { font: inherit; margin-top: 24px; width: 100%; padding: 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
  #send:disabled { opacity: 0.3; }
  #out { margin-top: 24px; white-space: pre-wrap; }
</style>
<script src="config.js?v=3"></script>
</head>
<body>
<main>
  <h1>CONNECT TEST（?test=1 的回答会标上 TEST_）</h1>
  <label>5 年後、あなたの仕事の何%を AI がやっている？ <b id="pv">50</b>%</label>
  <input id="percent" type="range" min="0" max="100" step="1" value="50">
  <label>AI がどんなに進化しても、手放したくないのは？</label>
  <div class="grid" id="keeps"></div>
  <button id="send" disabled>送信</button>
  <div id="out"></div>
</main>
<script>
const TEST = new URLSearchParams(location.search).has('test');
let keep = null;
const $ = (id) => document.getElementById(id);

$('percent').oninput = (e) => $('pv').textContent = e.target.value;
for (const k of KEEPS) {
  const b = document.createElement('button');
  b.textContent = k; b.setAttribute('aria-pressed', 'false');
  b.onclick = () => { keep = k; for (const o of $('keeps').children) o.setAttribute('aria-pressed', o === b); $('send').disabled = false; };
  $('keeps').appendChild(b);
}

// 表单不回传结果（no-cors），所以提交后再读一次 CSV 来确认
async function submit(percent, keep) {
  const body = new URLSearchParams({ [BACKEND.fields.percent]: percent, [BACKEND.fields.keep]: (TEST ? 'TEST_' : '') + keep });
  await fetch(BACKEND.submit, { method: 'POST', mode: 'no-cors', body });
}
async function readAll() {
  const res = await fetch(BACKEND.csv + '&t=' + Date.now());
  // 每格都带引号："2026-10-24 …","50","判断力"
  const rows = (await res.text()).trim().split(/\r?\n/).slice(1).map(l => l.slice(1, -1).split('","'));
  return rows.map(([time, percent, keep]) => ({ time, percent: +percent, keep: (keep || '').replace(/^TEST_/, '') }));
}

// 保险：人数只增不减（记住看过的最大值）
function seenMax(n) {
  let m = 0;
  try { m = +localStorage.getItem('seenMax') || 0; if (n > m) localStorage.setItem('seenMax', n); } catch (e) {}
  return Math.max(n, m);
}

$('send').onclick = async () => {
  const percent = +$('percent').value;
  $('send').disabled = true; $('out').textContent = '送信中…';
  try {
    const before = (await readAll()).length;
    await submit(percent, keep);
    const all = await readAll();
    // 保险：自己的答案还没出现在读回的数据里，就先加上
    if (all.length <= before) all.push({ percent, keep });
    const same = all.filter(r => r.keep === keep).length;
    const avg = Math.round(all.reduce((s, r) => s + r.percent, 0) / all.length);
    $('out').textContent = `あなた：${percent}% / ${keep}\nあなたは ${seenMax(all.length)} 人目\n全体の平均：${avg}%\n「${keep}」を選んだ人：${same} 人`;
  } catch (e) {
    $('out').textContent = '失敗：' + e.message;
  }
};
</script>
</body>
</html>
